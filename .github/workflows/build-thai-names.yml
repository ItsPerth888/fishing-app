name: Build Thai fish names
on:
  push:
    paths: ['scripts/build_thai_names.py', '.github/workflows/build-thai-names.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 20 1 * *'   # อัปเดตเดือนละครั้ง
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python scripts/build_thai_names.py
        continue-on-error: true
      - name: Commit data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update Thai fish names data"
          git pull --rebase origin main && git push
